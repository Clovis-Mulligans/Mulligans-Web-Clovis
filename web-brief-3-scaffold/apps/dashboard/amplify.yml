version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
    build:
      commands:
        - npx turbo run build --filter=dashboard
  artifacts:
    baseDirectory: apps/dashboard/.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/dashboard/.next/cache/**/*
