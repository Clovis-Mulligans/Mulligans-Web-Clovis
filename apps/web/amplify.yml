version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm install --legacy-peer-deps && cd apps/web
        build:
          commands:
            - cd ../.. && npm run build --workspace=apps/web
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
    appRoot: apps/web